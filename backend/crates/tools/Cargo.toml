[package]
name = "cleanflow-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
cleanflow-protocol = { path = "../protocol" }
cleanflow-store = { path = "../store" }
cleanflow-guardrails = { path = "../guardrails" }
cleanflow-oss-integrations = { path = "../oss-integrations", features = ["use-path-security"], optional = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
printpdf = { version = "0.8", optional = true }
chrono = { workspace = true }

[features]
default = []
use-pdf = ["dep:printpdf"]
use-path-security = ["dep:cleanflow-oss-integrations"]

[dev-dependencies]
tokio = { workspace = true }

