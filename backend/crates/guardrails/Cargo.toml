[package]
name = "cleanflow-guardrails"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
cleanflow-protocol = { path = "../protocol" }
cleanflow-config = { path = "../config" }
cleanflow-oss-integrations = { path = "../oss-integrations", features = ["use-llm-security"], optional = true }
base64 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
bytes = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
prometheus = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
once_cell = { workspace = true }
regex = "1.11"

[features]
default = []
use-llm-security = ["dep:cleanflow-oss-integrations"]

[dev-dependencies]
tokio-test = "0.4"

