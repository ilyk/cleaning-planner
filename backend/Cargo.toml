[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/auth",
    "crates/protocol",
    "crates/session",
    "crates/stream",
    "crates/guardrails",
    "crates/llm",
    "crates/tools",
    "crates/store",
    "crates/telemetry",
    "crates/config",
    "crates/domain",
    "crates/oss-integrations",
    "bin/clara-stream-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CleanFlow / Clara Backend Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-tungstenite = "0.24"
futures = "0.3"

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hyper = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.8"
base64 = "0.22"

# Auth
jsonwebtoken = "9.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "uuid"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Metrics & Tracing
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Config
dotenvy = "0.15"
config = "0.14"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.20"

# Testing
mockall = "0.13"
proptest = "1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
